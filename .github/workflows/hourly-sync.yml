name: Hourly Drive Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: hourly-drive-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger sync endpoint with retries
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          FALLBACK_APP_BASE_URL: https://weekplanner.trijbsworld.nl
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          base_url="${APP_BASE_URL:-}"

          if [ -z "${base_url}" ]; then
            echo "APP_BASE_URL variable ontbreekt; fallback domein wordt gebruikt."
            base_url="${FALLBACK_APP_BASE_URL}"
          fi

          if [[ "${base_url}" == *".onrender.com"* ]]; then
            echo "APP_BASE_URL wijst nog naar Render; fallback domein wordt gebruikt."
            base_url="${FALLBACK_APP_BASE_URL}"
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret ontbreekt."
            exit 1
          fi

          endpoint="${base_url%/}/api/cron/sync-drive"
          attempts=3
          delay_seconds=20

          for attempt in $(seq 1 "$attempts"); do
            echo "Sync attempt ${attempt}/${attempts}: ${endpoint}"

            http_code=$(curl \
              --silent \
              --show-error \
              --output /tmp/sync-response.txt \
              --write-out "%{http_code}" \
              --request POST \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "$endpoint") || http_code="000"

            cat /tmp/sync-response.txt || true
            echo
            echo "HTTP status: ${http_code}"

            if [ "$http_code" = "200" ]; then
              exit 0
            fi

            if [ "$attempt" -lt "$attempts" ]; then
              echo "Retry over ${delay_seconds}s..."
              sleep "$delay_seconds"
            fi
          done

          echo "Sync endpoint bleef falen."
          exit 1
